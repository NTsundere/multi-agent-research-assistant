name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Lint
        run: |
          pip install flake8
          flake8 app/ tests/ --max-line-length=120 --ignore=E402,E302,E303,W292,F401,E501
      - name: Test
        run: pytest tests/ --cov=app --cov-report=xml
        env:
          GOOGLE_API_KEY: "test-key"